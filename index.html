
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1>facebook</h1>
        <button id="themeToggle">🌙 Dark Mode</button>
    </header>

    <main class="feed">
        <h2>News Feed</h2>

        <article class="post">
            <h3>Alex Johnson</h3>
            <p class="time">10 minutes ago</p>
            <p>Hello everyone! Welcome to my new social page.</p>
            <div class="actions">
                <button>👍 Like</button>
                <button>💬 Comment</button>
                <button>↗ Share</button>
            </div>
        </article>

    </main>

    <script src="script.js"></script>
</body>
</html>
